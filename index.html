<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1620" />
    <meta
      name="description"
      content="Lumora Focus — 沉浸式番茄钟工作台：四场景音景、今日意图、专注统计。"
    />
    <title>Lumora Focus</title>

    <!--
      背景视频走 CloudFront（跨域，SW 不接管）。提前建连可以让首次切场景少一个 RTT；
      注意不能用 crossorigin：视频是普通媒体请求，带 CORS 的预连接反而对不上。
    -->
    <link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" />
    <link rel="dns-prefetch" href="https://d8j0ntlcm91z4.cloudfront.net" />

    <!-- 字体已镜像到本地（原先依赖 Google Fonts，现在不再有外部单点） -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-serif-latin-400-normal.woff2"
      crossorigin
    />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS 不支持 SVG 图标：必须是 PNG（180×180），否则装到桌面会用页面截图 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lumora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
