name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规范
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build
